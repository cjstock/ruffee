<!doctype html>
<html lang="en" class="h-full dark:bg-dark-purple bg-cinnabar">

<head>
	<link href="/assets/main.css" rel="stylesheet" />
	<link href="/assets/fontawesome/css/fontawesome.css" rel="stylesheet" />
	<link href="/assets/fontawesome/css/solid.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.js"
        integrity="sha384-yWakaGAFicqusuwOYEmoRjLNOC+6OFsdmwC2lbGQaRELtuVEqNzt11c2J711DeCZ"
        crossorigin="anonymous"></script>
	<title>{% block title %}{{ title }}{% endblock %}</title>
	{% block head %}{% endblock %}
</head>

<body class="h-full">
	<div>
		<div id="page-content" class="min-h-full">
			<div class="pb-32">
				<header class="py-10">
					<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
						{% block header %}
						{% endblock %}
					</div>
				</header>
			</div>

			<main class="-mt-32">
				<div class="mx-auto max-w-7xl px-4 pb-12 sm:px-6 lg:px-8">
					<div class="rounded-lg px-5 py-6 shadow sm:px-6">
						{% block content %}{% endblock %}
					</div>
				</div>
			</main>
		</div>
	</div>
</body>

</html>
